<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#17384D" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <title>Página no encontrada | ARQSA Arquitectos</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #0a0a0a linear-gradient(135deg, #17384d 0%, #0a0a0a 55%, #17384d 100%);
        color: #f5f4f0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 420px; }
      img { width: 120px; height: auto; }
      p.code { margin: 24px 0 8px; color: #95978a; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
      h1 { margin: 0 0 12px; font-size: 28px; font-weight: 600; }
      p { margin: 0 0 32px; color: rgba(245, 244, 240, 0.7); line-height: 1.6; }
      a {
        display: inline-block;
        padding: 12px 28px;
        border: 1px solid rgba(149, 151, 138, 0.5);
        border-radius: 999px;
        color: #f5f4f0;
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      a:hover, a:focus-visible { background: rgba(149, 151, 138, 0.15); }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-hero-400.webp" alt="ARQSA Arquitectos Sevillano Aguilar" width="400" height="400" />
      <p class="code">Error 404</p>
      <h1>Esta página no existe</h1>
      <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
      <a href="/">Ir al inicio</a>
    </main>
  </body>
</html>
